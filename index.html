<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geçmiş Olsun Sevgilim 🤍</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0f0f13;
        }

        .ascii-art {
            font-family: 'Courier New', Courier, monospace;
            white-space: pre;
            line-height: 1.1;
            text-align: center;
            text-shadow: 0 0 12px rgba(244, 114, 182, 0.6);
        }

        .animated-text {
            background: linear-gradient(270deg, #ff7eb3, #ff758c, #ffb199, #ff7eb3);
            background-size: 300% 300%;
            animation: gradientShift 4s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 10px rgba(255, 117, 140, 0.3));
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glow-bg {
            position: absolute;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(255,117,140,0.15) 0%, rgba(15,15,19,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative text-white select-none">

    <div class="glow-bg"></div>

    <div class="flex-1 flex items-end justify-center pb-8 w-full">
        <!-- Kedinin boyutunu mobilde ve masaüstünde güzel duracak şekilde ayarladık -->
        <pre id="cat-video" class="ascii-art text-pink-300 text-2xl sm:text-3xl md:text-5xl font-bold"></pre>
    </div>

    <div class="flex-1 flex items-start justify-center pt-4 w-full">
        <h1 class="text-6xl sm:text-7xl md:text-9xl font-black text-center animated-text px-4 tracking-tight leading-tight">
            Geçmiş Olsun<br>Sevgilim
        </h1>
    </div>

    <script>
        // 4 Karelik daha akıcı bir animasyon döngüsü (Çömelme -> Yükselme -> Havada -> İniş)
        const frames = [
            // Kare 1: Yerde çömelmiş, zıplamaya hazırlık
            `
     /\\___/\\
    (  o_o  )
  --(       )--
    /       \\
   /         \\
            `,
            // Kare 2: Kollar ve bacaklar toplanarak yukarı doğru itiş (Yükselme)
            `
     /\\___/\\
    (  o_o  )
   / (     ) \\
     |     |
     |     |
            `,
            // Kare 3: Kollar ve bacaklar tam açık, havada (Klasik Happy Cat pozu)
            `
 \\  /\\___/\\  /
  \\(  o_o  )/
   (       )
    \\     /
    /     \\
            `,
            // Kare 4: Yere doğru düşerken kollar ve bacaklar hafif kapanıyor (İniş)
            `
     /\\___/\\
    (  o_o  )
   / (     ) \\
     /     \\
    /       \\
            `
        ];

        let currentFrame = 0;
        const catElement = document.getElementById('cat-video');

        // Animasyon hızı 120ms (saniyede yaklaşık 8 kare), daha akıcı bir zıplama sağlar
        setInterval(() => {
            catElement.textContent = frames[currentFrame];
            currentFrame = (currentFrame + 1) % frames.length;
        }, 120); 
    </script>

</body>
</html>
